name: 'Setup Goose CLI'
description: 'Install and cache Goose AI agent for GitHub Actions workflows'
author: 'Hugues Clouâtre'
keywords:
  - ai
  - ai-agent
  - goose
  - automation
  - cli
inputs:
  version:
    description: 'Version of Goose to install. Examples: 1.19.1, 1.15.0. Defaults to latest stable if unset. Ignored when check-latest is true.'
    required: false
    default: '1.34.0'
  check-latest:
    description: 'Fetch and install the absolute latest Goose release from GitHub. When true, the version input is ignored.'
    required: false
    default: 'false'
outputs:
  goose-version:
    description: 'Installed Goose version'
    value: ${{ steps.resolve-version.outputs.version }}
  goose-path:
    description: 'Path to Goose binary directory'
    value: ${{ steps.setup-path.outputs.path }}
  cache-hit:
    description: 'Whether the Goose binary was restored from cache'
    value: ${{ steps.cache-goose.outputs.cache-hit == 'true' && 'true' || 'false' }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Check platform
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "::error::This action only supports Linux runners. Current OS: $RUNNER_OS"
          exit 1
        fi
    - name: Resolve version
      id: resolve-version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CHECK_LATEST: ${{ inputs.check-latest }}
      run: "VERSION=\"$INPUT_VERSION\"\n\nif [ \"$INPUT_CHECK_LATEST\" = \"true\" ]; then\n  echo \"::group::Checking for latest Goose version\"\n  \n  # Query GitHub API for latest release using gh CLI\n  LATEST_TAG=$(gh api repos/aaif-goose/goose/releases/latest --jq .tag_name)\n  \n  if [ $? -ne 0 ]; then\n    echo \"::error::Failed to query GitHub API for latest release\"\n    exit 1\n  fi\n  \n  # Remove 'v' prefix if present\n  LATEST_VERSION=\"${LATEST_TAG#v}\"\n  \n  if [ -z \"$LATEST_VERSION\" ] || [ \"$LATEST_VERSION\" = \"null\" ]; then\n    echo \"::error::Failed to extract latest version from GitHub API response\"\n    exit 1\n  fi\n  \n  # Validate version format (supports pre-release tags like 1.20.0-beta)\n  if ! [[ \"$LATEST_VERSION\" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+(-.+)?$ ]]; then\n    echo \"::error::Invalid version format from API: '$LATEST_VERSION'\"\n    exit 1\n  fi\n  \n  echo \"Latest version: $LATEST_VERSION\"\n  VERSION=\"$LATEST_VERSION\"\n  echo \"::endgroup::\"\nfi\n\nsafe_version=$(printf '%s' \"$VERSION\" | tr -d '\\n\\r')\necho \"version=$safe_version\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Cache Goose binary
      id: cache-goose
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.local/bin/goose
        key: goose-${{ steps.resolve-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          goose-${{ steps.resolve-version.outputs.version }}-${{ runner.os }}-
    - name: Install Goose
      id: install
      if: steps.cache-goose.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RESOLVED_VERSION: ${{ steps.resolve-version.outputs.version }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        VERSION="$RESOLVED_VERSION"
        mkdir -p ~/.local/bin
        echo "::group::Installing Goose v$VERSION"

        VERSION="${VERSION#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
          echo "::error::Invalid version format: '$VERSION'. Expected semver (e.g., 1.19.1 or 1.20.0-beta)"
          exit 1
        fi

        ARCH="$RUNNER_ARCH"
        if [ "$ARCH" = "X64" ]; then
          GOOSE_ARCH="x86_64"
        elif [ "$ARCH" = "ARM64" ]; then
          GOOSE_ARCH="aarch64"
        else
          echo "::error::Unsupported architecture: $ARCH"
          exit 1
        fi

        ARCHIVE="goose-${GOOSE_ARCH}-unknown-linux-gnu.tar.bz2"
        TEMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TEMP_DIR"' EXIT
        echo "Downloading $ARCHIVE"
        gh release download "v${VERSION}" -R aaif-goose/goose --pattern "${ARCHIVE}" -D "$TEMP_DIR"
        gh attestation verify "$TEMP_DIR/${ARCHIVE}" -R aaif-goose/goose || {
          echo "::error::Binary attestation failed for ${ARCHIVE}. The release may be unsigned or tampered."
          exit 1
        }
        tar -xj -C ~/.local/bin -f "$TEMP_DIR/${ARCHIVE}"

        echo "::endgroup::"
    - name: Setup PATH
      id: setup-path
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "path=$HOME/.local/bin" >> $GITHUB_OUTPUT
    - name: Verify installation
      shell: bash
      run: |
        echo "::group::Verifying Goose installation"
        goose --version
        echo "Installed binary:"
        ls -lh ~/.local/bin/goose
        echo "::endgroup::"
branding:
  icon: 'zap'
  color: 'purple'
