name: Test basic usage - install specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            echo "Installing gh CLI..."
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install -y gh
          else
            echo "gh CLI already installed: $(gh --version)"
          fi

      - id: action
        uses: .
        with:
          version: '1.33.1'

      - name: Assert goose-version output
        env:
          ACTUAL: ${{ steps.action.outputs.goose-version }}
        run: |
          echo "actual goose-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-version output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "1.33.1" ]; then
            echo "FAIL: expected goose-version '1.33.1' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: goose-version is correct"

      - name: Assert goose-path output
        env:
          ACTUAL: ${{ steps.action.outputs.goose-path }}
        run: |
          echo "actual goose-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-path output is empty"
            exit 1
          fi
          echo "PASS: goose-path is set to '$ACTUAL'"

      - name: Assert cache-hit output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "actual cache-hit: $ACTUAL"
          # cache-hit should be either 'true' or 'false'
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: cache-hit is '$ACTUAL'"

      - name: Assert goose binary exists on PATH
        run: |
          echo "Checking for goose binary..."
          if ! command -v goose &>/dev/null; then
            echo "FAIL: goose not found on PATH"
            exit 1
          fi
          echo "PASS: goose found at $(command -v goose)"

      - name: Assert goose version matches
        run: |
          echo "Running goose --version..."
          GOOSE_VER=$(goose --version 2>&1 || true)
          echo "goose --version output: $GOOSE_VER"
          if ! echo "$GOOSE_VER" | grep -q "1.33.1"; then
            echo "FAIL: expected version 1.33.1 in output but got: $GOOSE_VER"
            exit 1
          fi
          echo "PASS: goose version matches"
