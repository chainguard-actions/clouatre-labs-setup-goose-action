name: Test basic usage - install specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Setup Goose with specific version
        uses: .
        with:
          version: '1.19.1'
          check-latest: 'false'
        continue-on-error: true

      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GOOSE_VERSION: ${{ steps.action.outputs.goose-version }}
          GOOSE_PATH: ${{ steps.action.outputs.goose-path }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "goose-version: $GOOSE_VERSION"
          echo "goose-path: $GOOSE_PATH"
          echo "cache-hit: $CACHE_HIT"

          if [ "$OUTCOME" = "success" ]; then
            # Validate goose-version output
            if [ "$GOOSE_VERSION" != "1.19.1" ]; then
              echo "FAIL: expected goose-version '1.19.1', got '$GOOSE_VERSION'"
              exit 1
            fi
            echo "PASS: goose-version is correct"

            # Validate goose-path output
            if [ -z "$GOOSE_PATH" ]; then
              echo "FAIL: goose-path output is empty"
              exit 1
            fi
            echo "PASS: goose-path is set to '$GOOSE_PATH'"

            # Validate cache-hit is a known value
            if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
              echo "PASS: cache-hit output is valid: '$CACHE_HIT'"
            else
              echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/cache unavailable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert goose binary is executable (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping binary check"
            exit 0
          fi
          echo "Checking goose binary..."
          if ! command -v goose > /dev/null 2>&1; then
            echo "FAIL: goose not found in PATH"
            exit 1
          fi
          echo "goose found at: $(which goose)"
          goose --version
          echo "PASS: goose binary is executable"
