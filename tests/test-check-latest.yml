name: Test check-latest - install latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh &>/dev/null; then
            echo "Installing gh CLI..."
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install -y gh
          fi
          gh --version

      - id: action
        uses: .
        with:
          check-latest: 'true'

      - name: Assert goose-version output is non-empty and valid semver
        env:
          ACTUAL: ${{ steps.action.outputs.goose-version }}
        run: |
          echo "actual goose-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected goose-version to be non-empty"
            exit 1
          fi
          # Validate semver format (X.Y.Z or X.Y.Z-prerelease)
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "FAIL: goose-version '$ACTUAL' does not match semver format"
            exit 1
          fi
          echo "PASS: goose-version '$ACTUAL' is valid semver"

      - name: Assert goose-path output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.goose-path }}
        run: |
          echo "actual goose-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected goose-path to be non-empty"
            exit 1
          fi
          if [[ "$ACTUAL" != *".local/bin"* ]]; then
            echo "FAIL: expected goose-path to contain '.local/bin', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: goose-path is correct"

      - name: Assert goose binary exists at expected path
        run: |
          EXPECTED_PATH="$HOME/.local/bin/goose"
          echo "Checking for goose at: $EXPECTED_PATH"
          if [ ! -f "$EXPECTED_PATH" ]; then
            echo "FAIL: goose binary not found at $EXPECTED_PATH"
            exit 1
          fi
          if [ ! -x "$EXPECTED_PATH" ]; then
            echo "FAIL: goose binary at $EXPECTED_PATH is not executable"
            exit 1
          fi
          echo "PASS: goose binary exists and is executable"

      - name: Assert goose binary is on PATH and functional
        run: |
          echo "Checking goose binary..."
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v goose &>/dev/null; then
            echo "FAIL: goose not found on PATH"
            exit 1
          fi
          echo "goose found at: $(which goose)"
          goose --version
          echo "PASS: goose binary is functional"
