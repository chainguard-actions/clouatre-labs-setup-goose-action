name: Test check-latest flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            echo "Installing gh CLI..."
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install -y gh
          else
            echo "gh CLI already installed: $(gh --version)"
          fi

      - id: action
        uses: .
        with:
          check-latest: 'true'

      - name: Assert goose-version output is non-empty and valid semver
        env:
          ACTUAL: ${{ steps.action.outputs.goose-version }}
        run: |
          echo "actual goose-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-version output is empty when check-latest=true"
            exit 1
          fi
          # Validate semver format (e.g. 1.20.0 or 1.20.0-beta)
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "FAIL: goose-version '$ACTUAL' does not match semver format"
            exit 1
          fi
          echo "PASS: goose-version is a valid semver: $ACTUAL"

      - name: Assert goose-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.goose-path }}
        run: |
          echo "actual goose-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-path output is empty"
            exit 1
          fi
          echo "PASS: goose-path is set to '$ACTUAL'"

      - name: Assert cache-hit output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "actual cache-hit: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: cache-hit is '$ACTUAL'"

      - name: Assert goose binary is on PATH and runs
        run: |
          echo "Checking for goose binary..."
          if ! command -v goose &>/dev/null; then
            echo "FAIL: goose not found on PATH"
            exit 1
          fi
          GOOSE_VER=$(goose --version 2>&1 || true)
          echo "goose --version: $GOOSE_VER"
          if [ -z "$GOOSE_VER" ]; then
            echo "FAIL: goose --version returned empty output"
            exit 1
          fi
          echo "PASS: goose is installed and runs"

      - name: Assert goose binary path matches goose-path output
        env:
          GOOSE_PATH: ${{ steps.action.outputs.goose-path }}
        run: |
          echo "Expected goose-path: $GOOSE_PATH"
          BINARY_PATH=$(command -v goose 2>/dev/null || true)
          echo "Actual binary path: $BINARY_PATH"
          if [ -z "$BINARY_PATH" ]; then
            echo "FAIL: goose binary not found on PATH"
            exit 1
          fi
          # The binary should be under the reported goose-path directory
          if [[ "$BINARY_PATH" != "$GOOSE_PATH"* ]]; then
            echo "INFO: binary path '$BINARY_PATH' may differ from goose-path '$GOOSE_PATH' (PATH ordering)"
          fi
          echo "PASS: goose binary is accessible"
