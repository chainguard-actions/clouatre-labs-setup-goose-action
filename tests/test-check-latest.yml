name: Test check-latest - install latest Goose version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Setup Goose with check-latest
        uses: .
        with:
          check-latest: 'true'
        continue-on-error: true

      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GOOSE_VERSION: ${{ steps.action.outputs.goose-version }}
          GOOSE_PATH: ${{ steps.action.outputs.goose-path }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "goose-version: $GOOSE_VERSION"
          echo "goose-path: $GOOSE_PATH"
          echo "cache-hit: $CACHE_HIT"

          if [ "$OUTCOME" = "success" ]; then
            # Validate goose-version is non-empty and valid semver
            if [ -z "$GOOSE_VERSION" ]; then
              echo "FAIL: goose-version output is empty"
              exit 1
            fi
            # Validate semver format (X.Y.Z or X.Y.Z-prerelease)
            if ! echo "$GOOSE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
              echo "FAIL: goose-version '$GOOSE_VERSION' is not valid semver"
              exit 1
            fi
            echo "PASS: goose-version '$GOOSE_VERSION' is valid semver"

            # Validate goose-path output
            if [ -z "$GOOSE_PATH" ]; then
              echo "FAIL: goose-path output is empty"
              exit 1
            fi
            echo "PASS: goose-path is set to '$GOOSE_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/cache unavailable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert goose binary is available and runs (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping binary check"
            exit 0
          fi
          echo "Checking goose binary..."
          if ! command -v goose > /dev/null 2>&1; then
            echo "FAIL: goose not found in PATH"
            exit 1
          fi
          echo "goose found at: $(which goose)"
          goose --version
          echo "PASS: goose binary is available and executable"
