name: Test check-latest mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake gh CLI and goose binary
        run: |
          # Create a fake goose binary that responds to --version
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then\n  echo "goose 1.34.0"\nfi\n' > "$HOME/.local/bin/goose"
          chmod +x "$HOME/.local/bin/goose"

          # Create a fake tar.bz2 archive containing the fake goose binary
          ARCHIVE_DIR=$(mktemp -d)
          cp "$HOME/.local/bin/goose" "$ARCHIVE_DIR/goose"
          tar -cj -f /tmp/fake-goose-x86_64.tar.bz2 -C "$ARCHIVE_DIR" goose
          tar -cj -f /tmp/fake-goose-aarch64.tar.bz2 -C "$ARCHIVE_DIR" goose
          rm -rf "$ARCHIVE_DIR"

          # Create a fake gh CLI that handles release download, attestation verify,
          # and API calls for latest version
          # The action uses: gh api repos/aaif-goose/goose/releases/latest --jq .tag_name
          # which returns just the tag_name value (not full JSON) when --jq is used
          mkdir -p /tmp/fake-gh-bin
          printf '#!/bin/sh\n' > /tmp/fake-gh-bin/gh
          printf '# Fake gh CLI for testing goose setup action (check-latest mode)\n' >> /tmp/fake-gh-bin/gh
          printf 'case "$*" in\n' >> /tmp/fake-gh-bin/gh
          printf '  *"releases/latest"*|*"api"*)\n' >> /tmp/fake-gh-bin/gh
          printf '    echo "v1.34.0"\n' >> /tmp/fake-gh-bin/gh
          printf '    exit 0\n' >> /tmp/fake-gh-bin/gh
          printf '    ;;\n' >> /tmp/fake-gh-bin/gh
          printf '  *"release download"*)\n' >> /tmp/fake-gh-bin/gh
          printf '    DEST_DIR=""\n' >> /tmp/fake-gh-bin/gh
          printf '    PATTERN=""\n' >> /tmp/fake-gh-bin/gh
          printf '    prev=""\n' >> /tmp/fake-gh-bin/gh
          printf '    for arg in "$@"; do\n' >> /tmp/fake-gh-bin/gh
          printf '      if [ "$prev" = "-D" ]; then DEST_DIR="$arg"; fi\n' >> /tmp/fake-gh-bin/gh
          printf '      if [ "$prev" = "--pattern" ]; then PATTERN="$arg"; fi\n' >> /tmp/fake-gh-bin/gh
          printf '      prev="$arg"\n' >> /tmp/fake-gh-bin/gh
          printf '    done\n' >> /tmp/fake-gh-bin/gh
          printf '    if [ -n "$DEST_DIR" ]; then\n' >> /tmp/fake-gh-bin/gh
          printf '      mkdir -p "$DEST_DIR"\n' >> /tmp/fake-gh-bin/gh
          printf '      if echo "$PATTERN" | grep -q "aarch64"; then\n' >> /tmp/fake-gh-bin/gh
          printf '        cp /tmp/fake-goose-aarch64.tar.bz2 "$DEST_DIR/$PATTERN"\n' >> /tmp/fake-gh-bin/gh
          printf '      else\n' >> /tmp/fake-gh-bin/gh
          printf '        cp /tmp/fake-goose-x86_64.tar.bz2 "$DEST_DIR/$PATTERN"\n' >> /tmp/fake-gh-bin/gh
          printf '      fi\n' >> /tmp/fake-gh-bin/gh
          printf '    fi\n' >> /tmp/fake-gh-bin/gh
          printf '    exit 0\n' >> /tmp/fake-gh-bin/gh
          printf '    ;;\n' >> /tmp/fake-gh-bin/gh
          printf '  *"attestation verify"*)\n' >> /tmp/fake-gh-bin/gh
          printf '    echo "Attestation verification skipped (mock)"\n' >> /tmp/fake-gh-bin/gh
          printf '    exit 0\n' >> /tmp/fake-gh-bin/gh
          printf '    ;;\n' >> /tmp/fake-gh-bin/gh
          printf 'esac\n' >> /tmp/fake-gh-bin/gh
          printf 'exit 0\n' >> /tmp/fake-gh-bin/gh
          chmod +x /tmp/fake-gh-bin/gh

          # Add fake gh to PATH via GITHUB_PATH so composite action steps see it
          echo "/tmp/fake-gh-bin" >> "$GITHUB_PATH"

          echo "Setup complete"
          ls -la /tmp/fake-gh-bin/
          ls -la "$HOME/.local/bin/"

      - id: action
        uses: .
        with:
          check-latest: 'true'

      - name: Assert goose-version output is non-empty semver
        env:
          ACTUAL: ${{ steps.action.outputs.goose-version }}
        run: |
          echo "actual goose-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-version output is empty when check-latest=true"
            exit 1
          fi
          # Validate it looks like a semver (e.g. 1.34.0 or 1.20.0-beta)
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "FAIL: goose-version '$ACTUAL' does not look like a valid semver"
            exit 1
          fi
          echo "PASS: goose-version is '$ACTUAL'"

      - name: Assert goose-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.goose-path }}
        run: |
          echo "actual goose-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-path output is empty"
            exit 1
          fi
          echo "PASS: goose-path is '$ACTUAL'"

      - name: Assert goose binary exists and is executable
        run: |
          echo "Checking ~/.local/bin/goose"
          if [ ! -f "$HOME/.local/bin/goose" ]; then
            echo "FAIL: goose binary not found at ~/.local/bin/goose"
            exit 1
          fi
          echo "PASS: goose binary found"
          ls -lh "$HOME/.local/bin/goose"
          OUTPUT=$("$HOME/.local/bin/goose" --version 2>&1 || true)
          echo "goose --version output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: goose --version produced no output"
            exit 1
          fi
          echo "PASS: goose is installed and working"

      - name: Assert cache-hit output is a boolean string
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "actual cache-hit: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: cache-hit is '$ACTUAL'"
