name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gh CLI is available
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "Installing gh CLI..."
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install -y gh
          fi
          gh --version

      - id: action
        uses: .
        with:
          version: '1.33.1'

      - name: Assert goose-version output matches requested version
        env:
          EXPECTED: '1.33.1'
          ACTUAL: ${{ steps.action.outputs.goose-version }}
        run: |
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert goose binary is installed and runnable
        run: |
          echo "Checking goose binary..."
          if ! command -v goose &>/dev/null; then
            echo "FAIL: goose not found in PATH"
            exit 1
          fi
          GOOSE_BIN=$(command -v goose)
          echo "Found goose at: $GOOSE_BIN"
          if [ ! -x "$GOOSE_BIN" ]; then
            echo "FAIL: goose binary is not executable"
            exit 1
          fi
          echo "PASS"

      - name: Assert goose-path output points to correct directory
        env:
          ACTUAL: ${{ steps.action.outputs.goose-path }}
        run: |
          echo "actual goose-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: goose-path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: goose-path directory does not exist: $ACTUAL"
            exit 1
          fi
          if [ ! -f "$ACTUAL/goose" ]; then
            echo "FAIL: goose binary not found in goose-path: $ACTUAL/goose"
            exit 1
          fi
          echo "PASS: goose binary found at $ACTUAL/goose"
